backend:
  name: github
  repo: Aryan-DMS/aero-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Folder Collection (For multiple events)
  - name: "events"
    label: "Mission Manifest"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Event Title", name: "title", widget: "string"}
      - {label: "Deployment Date", name: "date", widget: "datetime"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Hardware Class", name: "hardware", widget: "string"}
      - {label: "Operational Briefing", name: "body", widget: "markdown"}

  # 2. File Collection (For single static pages)
  - name: "pages"
    label: "Core Pages"
    files:
      - label: "About Section"
        name: "about"
        file: "content/pages/about.md"
        fields:
          # Division Overview (Object to separate subtitle from text)
          - label: "Division Overview"
            name: "overview"
            widget: "object"
            fields:
              - {label: "Meta Subtitle", name: "subtitle", widget: "string", default: "EST. 2015 // PUNE, INDIA"}
              - {label: "Main Briefing", name: "body", widget: "markdown"}
          
          # Engineering Philosophy (Strict list of 3 blocks)
          - label: "Engineering Philosophy Pillars"
            name: "philosophy"
            widget: "list"
            min: 3
            max: 3
            summary: '{{fields.title}}'
            fields:
              - {label: "Pillar Title", name: "title", widget: "string"}
              - {label: "Pillar Description", name: "body", widget: "text"}
          
          # Scope of Operation (Standard text block)
          - label: "Scope of Operation"
            name: "scope"
            widget: "markdown"

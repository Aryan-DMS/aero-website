backend:
  name: github
  repo: Aryan-DMS/aero-website
  branch: main
  base_url: "https://aero-website-7xh.pages.dev"
  auth_endpoint: "oauth/auth"

media_library:
  name: cloudinary
  config:
    cloud_name: "ylxttnsp"
    api_key: "185379971175851"
    default_transformations:
      - fetch_format: auto
      - quality: auto

collections:
  # ==========================================
  # DATABASES (Dynamic Collections)
  # ==========================================
  - name: "events"
    label: "Mission Manifest (Events)"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Event Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Active", "Past", "Timeline"]}
      - {label: "Display Date (e.g. DEC 2026)", name: "dateString", widget: "string"}
      - {label: "Location or Type", name: "location", widget: "string"}
      - {label: "Hardware Class", name: "hardware", widget: "string", required: false}
      - {label: "Card Summary", name: "summary", widget: "text"}
      - {label: "Cover Image", name: "image", widget: "image"}
      - {label: "Operational Briefing", name: "body", widget: "markdown"}

  - name: "achievements"
    label: "Mission Reports (Deployments)"
    folder: "content/achievements"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Expanded Cinematic Title (e.g. National Drone Techfest: Securing AIR 5)", name: "title", widget: "string"}
      - {label: "Compact Card Title (e.g. National Drone Techfest)", name: "card_title", widget: "string"}
      - {label: "Hero Meta Tag (e.g. MISSION LOG // DEC 2026 // PUNE, INDIA)", name: "hero_meta", widget: "string"}
      - {label: "Card Meta Tag (e.g. DEC 2026 // OVERALL RANK: AIR 5)", name: "card_meta", widget: "string"}
      - {label: "Cover/Hero Image", name: "image", widget: "image"}
      - {label: "Card Summary (Short paragraph for the grid)", name: "summary", widget: "text"}
      - {label: "Hardware Deployed (e.g. Project Valkyrie (Quadcopter))", name: "hardware", widget: "string"}
      - {label: "Overall Result (e.g. All India Rank 5 (out of 102))", name: "result", widget: "string"}
      - label: "Mission Report (Block Builder)"
        name: "blocks"
        widget: "list"
        summary: '{{fields.type}} Block'
        types:
          - label: "Text Section"
            name: "text_block"
            widget: "object"
            fields:
              - {label: "Section Heading (Optional)", name: "heading", widget: "string", required: false, hint: "Generates the massive white H3 heading"}
              - {label: "Text Content", name: "content", widget: "markdown", hint: "Standard paragraph text"}
          - label: "Inline Image"
            name: "image_block"
            widget: "object"
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image Alt Text", name: "alt", widget: "string"}

  - name: "models"
    label: "The Fleet (Models)"
    folder: "content/models"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Model Name (e.g. Project Valkyrie v2.0)", name: "title", widget: "string"}
      - {label: "Card Meta Tag (e.g. CLASS // AUTONOMOUS QUADCOPTER)", name: "card_meta", widget: "string"}
      - {label: "Hero Meta Tag (e.g. CLASS: AUTONOMOUS QUADCOPTER // STATUS: ACTIVE)", name: "hero_meta", widget: "string"}
      - {label: "Cover/Hero Image", name: "image", widget: "image"}
      - label: "Quick Specs (For the Grid Card - Max 4)"
        name: "card_specs"
        widget: "list"
        fields:
          - {label: "Label (e.g. Max Takeoff)", name: "label", widget: "string"}
          - {label: "Value (e.g. 4.2 kg)", name: "value", widget: "string"}
      - label: "Physical Dimensions (For Expanded Page)"
        name: "dimensions"
        widget: "list"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Value", name: "value", widget: "string"}
      - label: "Avionics & Power Systems (For Expanded Page)"
        name: "systems"
        widget: "list"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Value", name: "value", widget: "string"}
      - label: "Engineering Summary (Block Builder)"
        name: "blocks"
        widget: "list"
        summary: '{{fields.type}} Block'
        types:
          - label: "Text Section"
            name: "text_block"
            widget: "object"
            fields:
              - {label: "Section Heading (Optional)", name: "heading", widget: "string", required: false}
              - {label: "Text Content", name: "content", widget: "markdown"}
          - label: "Inline Image"
            name: "image_block"
            widget: "object"
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image Alt Text", name: "alt", widget: "string"}

  - name: "personnel"
    label: "Personnel Roster"
    folder: "content/personnel"
    create: true
    slug: "{{name}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Division Category", name: "division", widget: "string", hint: "Type a division to group them on the main page (e.g., Core Team, Juniors)"}
      - {label: "Role / Title", name: "role", widget: "string"}
      - {label: "Profile Image", name: "image", widget: "image"}
      - {label: "Academic Major", name: "major", widget: "string"}
      - {label: "Joined Division", name: "joined", widget: "string"}
      - {label: "LinkedIn URL", name: "linkedin", widget: "string"}
      - {label: "Full Bio", name: "body", widget: "markdown"}

  # ==========================================
  # MASTER PAGES (Single File Configuration)
  # ==========================================
  - name: "page_gallery"
    label: "Page: Gallery"
    files:
      - label: "Gallery Editor"
        name: "gallery"
        file: "content/pages/gallery.md"
        fields:
          - {name: "permalink", widget: "hidden", default: false}
          - label: "Operations & Flight Logs"
            name: "operations"
            widget: "list"
            summary: '{{fields.meta}} - {{fields.caption}}'
            fields:
              - {label: "Media Type", name: "type", widget: "select", options: ["image", "video"]}
              - {label: "Media File (Image or Video Upload)", name: "src", widget: "file"}
              - {label: "Video Thumbnail (Required if media is a video)", name: "thumbnail", widget: "image", required: false}
              - {label: "Grid Layout Size", name: "grid_span", widget: "select", options: [{label: "Standard Box (1x1)", value: "standard"}, {label: "Wide Horizontal (2x1)", value: "span-2-col"}, {label: "Tall Vertical (1x2)", value: "span-2-row"}, {label: "Massive Feature (2x2)", value: "featured-item"}], default: "standard"}
              - {label: "Top Meta Tag (e.g. FLIGHT LOG, FIELD TEST)", name: "meta", widget: "string"}
              - {label: "Caption / Title", name: "caption", widget: "string"}
          - label: "Hall of Records (Awards)"
            name: "awards"
            widget: "list"
            summary: '{{fields.meta}} - {{fields.caption}}'
            fields:
              - {label: "Media Type", name: "type", widget: "select", options: ["image", "video"], default: "image"}
              - {label: "Media File (Image or Video Upload)", name: "src", widget: "file"}
              - {label: "Video Thumbnail", name: "thumbnail", widget: "image", required: false}
              - {label: "Grid Layout Size", name: "grid_span", widget: "select", options: [{label: "Standard Box (1x1)", value: "standard"}, {label: "Wide Horizontal (2x1)", value: "span-2-col"}, {label: "Tall Vertical (1x2)", value: "span-2-row"}, {label: "Massive Feature (2x2)", value: "featured-item"}], default: "span-2-col"}
              - {label: "Top Meta Tag (e.g. ACCOLADE)", name: "meta", widget: "string"}
              - {label: "Caption / Title", name: "caption", widget: "string"}

  - name: "page_achievements_timeline"
    label: "Page: Achievements Timeline"
    files:
      - label: "Timeline Editor"
        name: "achievements_timeline"
        file: "content/pages/achievements_timeline.md"
        fields:
          - label: "Historical Milestones"
            name: "timeline"
            widget: "list"
            fields:
              - {label: "Date / Event Meta (e.g. 2025 // SAE AERO DESIGN)", name: "date_meta", widget: "string"}
              - {label: "Milestone Title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}

  - name: "page_about"
    label: "Page: About Us"
    files:
      - label: "About Us Editor"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - label: "Division Overview"
            name: "overview"
            widget: "object"
            fields:
              - label: "Meta Subtitle"
                name: "subtitle"
                widget: "string"
                default: "EST. 2015 // PUNE, INDIA"
              - label: "Overview Image"
                name: "image"
                widget: "image"
              - label: "Main Briefing"
                name: "body"
                widget: "markdown"
          - label: "Engineering Philosophy Pillars"
            name: "philosophy"
            widget: "list"
            fields:
              - label: "Pillar Title"
                name: "title"
                widget: "string"
              - label: "Pillar Description"
                name: "body"
                widget: "text"
          - label: "Scope of Operation"
            name: "scope"
            widget: "markdown"

  - name: "page_contact"
    label: "Page: Contact Details"
    files:
      - label: "Contact Details Editor"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - label: "Primary Email"
            name: "email"
            widget: "string"
          - label: "Facility Location"
            name: "location"
            widget: "text"
          - label: "Direct Line"
            name: "phone"
            widget: "string"
          - label: "Social Networks"
            name: "socials"
            widget: "list"
            summary: '{{fields.platform}}'
            fields:
              - label: "Platform Name"
                name: "platform"
                widget: "string"
              - label: "Profile URL"
                name: "url"
                widget: "string"
                

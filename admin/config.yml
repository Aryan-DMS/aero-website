backend:
  name: github
  repo: Aryan-DMS/aero-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Folder Collection (For multiple events)
  - name: "events"
    label: "Mission Manifest"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Event Title", name: "title", widget: "string"}
      - {label: "Deployment Date", name: "date", widget: "datetime"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Hardware Class", name: "hardware", widget: "string"}
      - {label: "Operational Briefing", name: "body", widget: "markdown"}

  # 2. File Collection (For single static pages)
  - name: "pages"
    label: "Core Pages"
    files:
      - label: "About Section"
        name: "about"
        file: "content/pages/about.md" # Where the text file will be saved
        fields:
          - {label: "Division Overview", name: "overview", widget: "markdown"}
          - {label: "Engineering Philosophy", name: "philosophy", widget: "markdown"}
          - {label: "Scope of Operation", name: "scope", widget: "markdown"}

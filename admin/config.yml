backend:
  name: github
  repo: Aryan-DMS/aero-website
  branch: main
  base_url: "https://aero-website-7xh.pages.dev"
  auth_endpoint: "oauth/auth"

# Global Editor Preferences
editor:
  preview: false

media_library:
  name: cloudinary
  config:
    cloud_name: "ylxttnsp"
    api_key: "185379971175851"
    default_transformations:
      - fetch_format: auto
      - quality: auto

collections:
  # ==========================================
  # GROUP 1: ACTIVE OPERATIONS
  # ==========================================
  - name: "events"
    label: "🚀 Upcoming Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "[{{card.category}}] {{card.title}} // {{card.dateString}}"
    fields:
      - {label: "System Date (Controls Sorting)", name: "date", widget: "datetime"}
      - label: "📦 BOX 1: THE GRID CARD (Always Required)"
        name: "card"
        widget: "object"
        collapsed: false
        fields:
          - {label: "Event Title", name: "title", widget: "string"}
          - {label: "Category", name: "category", widget: "select", options: ["Active", "Past", "Timeline"]}
          - {label: "Display Date (e.g. DEC 2026)", name: "dateString", widget: "string"}
          - {label: "Location or Type", name: "location", widget: "string"}
          - {label: "Card Summary", name: "summary", widget: "text"}
          - {label: "Cover Image", name: "image", widget: "image"}
          - {label: "⚙️ Engine Mode (Automation vs Manual)", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          
      - label: "🤖 BOX 2: THE AUTOMATION ENGINE (Just Paste JSON)"
        name: "automation"
        widget: "object"
        collapsed: true
        fields:
          - {label: "🧠 AI Intelligence Payload", name: "payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          
      - label: "✍️ BOX 3: THE MANUAL OVERRIDE (Custom Build)"
        name: "manual"
        widget: "object"
        collapsed: true
        fields:
          - {label: "Expanded Cinematic Title", name: "title", widget: "string", required: false}
          - {label: "Action Button Type", name: "action_type", widget: "select", options: ["Briefing", "Application", "None"], default: "Briefing", required: false}
          - {label: "Application Link", name: "application_link", widget: "string", required: false}
          - label: "HUD Metrics (Left Sidebar)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label (e.g. COORDINATES)", name: "label", widget: "string"}
              - {label: "Value (e.g. MIT, Pune)", name: "value", widget: "string"}
          - label: "Manual Narrative Builder"
            name: "blocks"
            widget: "list"
            collapsed: true
            required: false
            summary: '{{fields.type}} Block'
            types:
              - label: "Text Section"
                name: "text_block"
                widget: "object"
                fields:
                  - {label: "Section Heading", name: "heading", widget: "string", required: false}
                  - {label: "Text Content", name: "content", widget: "markdown"}
              - label: "Inline Image"
                name: "image_block"
                widget: "object"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image Alt Text", name: "alt", widget: "string"}

  - name: "drives"
    label: "📢 Recruitment Drives"
    folder: "content/drives"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "System Date (Controls Sorting)", name: "date", widget: "datetime"}
      - {label: "Drive Title", name: "title", widget: "string"}
      - {label: "Master Status", name: "status", widget: "select", options: ["Live", "Archived"]}
      - {label: "Thumbnail Image", name: "image", widget: "image"}
      - {label: "Open Roles", name: "roles", widget: "string"}
      - {label: "Google Sheet CSV Link", name: "csv_link", widget: "string", required: false, hint: "Paste the Google Sheets 'Publish to Web' CSV link here to automatically sync candidate data."}
      
      - label: "⏱️ Master Timeline & Schedules"
        name: "timeline"
        widget: "object"
        collapsed: false
        fields:
          - {label: "Phase 01: Application Deadline", name: "phase1_deadline", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: true}
          - {label: "Phase 02: Shortlist Release", name: "phase2_release", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false}
          - {label: "Phase 03: Interview Logistics Release", name: "phase3_release", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false}
          - {label: "Phase 04: Final Outcomes Release", name: "phase4_release", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false}

      - label: "Phase 1: The Directive (Application & Syllabus)"
        name: "phase1"
        widget: "object"
        collapsed: true
        fields:
          - label: "HUD Metrics (Left Sidebar Builder)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label (e.g. DEADLINE)", name: "label", widget: "string"}
              - {label: "Value (e.g. FEB 15)", name: "value", widget: "string"}
          - {label: "Activate Application Tracker", name: "action_tracker", widget: "boolean", default: false}
          - {label: "Application Form Link", name: "form_link", widget: "string", required: false}
          - {label: "⚙️ Engine Mode", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          - {label: "🧠 AI Intelligence Payload", name: "automation_payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          - {label: "Legacy Phase Report", name: "report", widget: "markdown", required: false}

      - label: "Phase 2: First Filter (Shortlist)"
        name: "phase2"
        widget: "object"
        collapsed: true
        fields:
          - label: "HUD Metrics (Left Sidebar Builder)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
          - {label: "⚙️ Engine Mode", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          - {label: "🧠 AI Intelligence Payload", name: "automation_payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          - {label: "Legacy Phase Report", name: "report", widget: "markdown", required: false}

      - label: "Phase 3: Engagement (Interviews)"
        name: "phase3"
        widget: "object"
        collapsed: true
        fields:

          - label: "HUD Metrics (Left Sidebar Builder)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
          - {label: "⚙️ Engine Mode", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          - {label: "🧠 AI Intelligence Payload", name: "automation_payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          - {label: "Legacy Phase Report", name: "report", widget: "markdown", required: false}

      - label: "Phase 4: Outcomes (Results)"
        name: "phase4"
        widget: "object"
        collapsed: true
        fields:
          - label: "HUD Metrics (Left Sidebar Builder)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
          - {label: "⚙️ Engine Mode", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          - {label: "🧠 AI Intelligence Payload", name: "automation_payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          - {label: "Legacy Phase Report", name: "report", widget: "markdown", required: false}

  # ==========================================
  # GROUP 2: HARDWARE & LOGS
  # ==========================================
  - name: "achievements"
    label: "🎖️ Mission Reports (Achievements)"
    folder: "content/achievements"
    create: true
    slug: "{{slug}}"
    summary: "{{card.meta}} // {{card.title}}"
    fields:
      - {label: "System Date (Controls Sorting)", name: "date", widget: "datetime"}
      - label: "📦 BOX 1: THE GRID CARD (Always Required)"
        name: "card"
        widget: "object"
        collapsed: false
        fields:
          - {label: "Compact Card Title", name: "title", widget: "string"}
          - {label: "Card Meta Tag", name: "meta", widget: "string"}
          - {label: "Card Summary", name: "summary", widget: "text"}
          - {label: "Cover/Hero Image", name: "image", widget: "image"}
          - {label: "⚙️ Engine Mode (Automation vs Manual)", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          
      - label: "🤖 BOX 2: THE AUTOMATION ENGINE (Just Paste JSON)"
        name: "automation"
        widget: "object"
        collapsed: true
        fields:
          - {label: "🧠 AI Intelligence Payload", name: "payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          
      - label: "✍️ BOX 3: THE MANUAL OVERRIDE (Custom Build)"
        name: "manual"
        widget: "object"
        collapsed: true
        fields:
          - {label: "Expanded Cinematic Title", name: "title", widget: "string", required: false}
          - {label: "Hero Meta Tag", name: "hero_meta", widget: "string", required: false}
          - {label: "Primary HUD Metric Label (e.g. OVERALL RANK)", name: "primary_label", widget: "string", required: false}
          - {label: "Primary HUD Metric Value (e.g. AIR 5)", name: "primary_value", widget: "string", required: false}
          - label: "Secondary HUD Metrics (Left Sidebar)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
          - label: "Manual Narrative Builder"
            name: "blocks"
            widget: "list"
            collapsed: true
            required: false
            summary: '{{fields.type}} Block'
            types:
              - label: "Text Section"
                name: "text_block"
                widget: "object"
                fields:
                  - {label: "Section Heading", name: "heading", widget: "string", required: false}
                  - {label: "Text Content", name: "content", widget: "markdown"}
              - label: "Inline Image"
                name: "image_block"
                widget: "object"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image Alt Text", name: "alt", widget: "string"}

  - name: "models"
    label: "🚁 The Fleet (Models)"
    folder: "content/models"
    create: true
    slug: "{{slug}}"
    summary: "[{{card.meta}}] {{card.title}}"
    fields:
      - {label: "System Date (Controls Sorting)", name: "date", widget: "datetime"}
      - label: "📦 BOX 1: THE GRID CARD (Always Required)"
        name: "card"
        widget: "object"
        collapsed: false
        fields:
          - {label: "Model Name", name: "title", widget: "string"}
          - {label: "Card Meta Tag", name: "meta", widget: "string"}
          - {label: "Cover/Hero Image", name: "image", widget: "image"}
          - label: "Quick Specs (For Grid)"
            name: "specs"
            widget: "list"
            collapsed: true
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
          - {label: "⚙️ Engine Mode (Automation vs Manual)", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}
          
      - label: "🤖 BOX 2: THE AUTOMATION ENGINE (Just Paste JSON)"
        name: "automation"
        widget: "object"
        collapsed: true
        fields:
          - {label: "🧠 AI Intelligence Payload", name: "payload", widget: "code", default_language: "json", output_code_only: true, required: false}
          
      - label: "✍️ BOX 3: THE MANUAL OVERRIDE (Custom Build)"
        name: "manual"
        widget: "object"
        collapsed: true
        fields:
          - {label: "Hero Meta Tag", name: "hero_meta", widget: "string", required: false}
          - label: "HUD Metrics (Left Sidebar)"
            name: "metrics"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - {label: "Label (e.g. CLASSIFICATION)", name: "label", widget: "string"}
              - {label: "Value (e.g. EXPERIMENTAL)", name: "value", widget: "string"}
          - label: "Manual Narrative Builder"
            name: "blocks"
            widget: "list"
            collapsed: true
            required: false
            summary: '{{fields.type}} Block'
            types:
              - label: "Text Section"
                name: "text_block"
                widget: "object"
                fields:
                  - {label: "Section Heading", name: "heading", widget: "string", required: false}
                  - {label: "Text Content", name: "content", widget: "markdown"}
              - label: "Inline Image"
                name: "image_block"
                widget: "object"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image Alt Text", name: "alt", widget: "string"}

  # ==========================================
  # GROUP 3: TEAM & PARTNERS
  # ==========================================
  - name: "personnel"
    label: "👥 Core Personnel"
    folder: "content/personnel"
    create: true
    slug: "{{card.name}}"
    summary: "[{{card.division}}] {{card.name}} - {{card.role}}"
    fields:
      - label: "📦 BOX 1: THE ROSTER CARD (Always Required)"
        name: "card"
        widget: "object"
        collapsed: false
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Division Category", name: "division", widget: "select", options: ["Faculty Advisor", "Core Team", "Juniors"], default: "Core Team"}
          - {label: "Role / Title", name: "role", widget: "string"}
          - {label: "Profile Image", name: "image", widget: "image"}
          - {label: "⚙️ Engine Mode (Automation vs Manual)", name: "report_mode", widget: "select", options: ["Automation", "Manual"], default: "Automation"}

      - label: "🤖 BOX 2: THE AUTOMATION ENGINE (Just Paste JSON)"
        name: "automation"
        widget: "object"
        collapsed: true
        fields:
          - {label: "🧠 AI Intelligence Payload", name: "payload", widget: "code", default_language: "json", output_code_only: true, required: false}

      - label: "✍️ BOX 3: THE MANUAL OVERRIDE (Custom Build)"
        name: "manual"
        widget: "object"
        collapsed: true
        fields:
          - {label: "Academic Major", name: "major", widget: "string", required: false}
          - {label: "Joined Division (Year)", name: "joined", widget: "string", required: false}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - {label: "Personal Quote", name: "quote", widget: "text", required: false}
          - {label: "Manual Bio", name: "body", widget: "markdown", required: false}

  # ==========================================
  # GROUP 4: SITE CONFIGURATION (PAGES)
  # ==========================================
  - name: "page_home"
    label: "🏠 Page: Homepage"
    files:
      - label: "Homepage Editor"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - {name: "permalink", widget: "hidden", default: false}
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Overline", name: "overline", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Sub-headline", name: "desc", widget: "text"}
              - {label: "Footer Line", name: "footer_line", widget: "string"}
          - label: "Stats Bar"
            name: "stats"
            widget: "list"
            collapsed: true
            min: 4
            max: 4
            fields:
              - {label: "Value", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
          - label: "Mission Section"
            name: "mission"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Overline", name: "overline", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Body Text", name: "body", widget: "text"}
          - label: "Cinematic Spacer Quote"
            name: "cinematic_quote"
            widget: "object"
            collapsed: true
            fields:
              - {label: "The Quote", name: "text", widget: "text"}
              - {label: "The Author", name: "author", widget: "string"}
          - label: "Software Marquee Items"
            name: "marquee"
            widget: "list"
            collapsed: true
            field: {label: "Software Name", name: "item", widget: "string"}
          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Description", name: "desc", widget: "string"}

  - name: "page_about"
    label: "📖 Page: About Us"
    files:
      - label: "About Us Editor"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - label: "Division Overview"
            name: "overview"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Meta Subtitle", name: "subtitle", widget: "string", default: "EST. 2015 // PUNE, INDIA"}
              - {label: "Overview Image", name: "image", widget: "image"}
              - {label: "Main Briefing", name: "body", widget: "markdown"}
          - label: "Engineering Philosophy Pillars"
            name: "philosophy"
            widget: "list"
            collapsed: true
            fields:
              - {label: "Pillar Title", name: "title", widget: "string"}
              - {label: "Pillar Description", name: "body", widget: "text"}
          - {label: "Scope of Operation", name: "scope", widget: "markdown"}

  - name: "page_gallery"
    label: "📸 Page: Gallery"
    files:
      - label: "Gallery Editor"
        name: "gallery"
        file: "content/pages/gallery.md"
        fields:
          - {name: "permalink", widget: "hidden", default: false}
          - label: "Operations & Flight Logs"
            name: "operations"
            widget: "list"
            collapsed: true
            summary: '{{fields.meta}} - {{fields.caption}}'
            fields:
              - {label: "Media Type", name: "type", widget: "select", options: ["image", "video"]}
              - {label: "Media File", name: "src", widget: "file"}
              - {label: "Video Thumbnail", name: "thumbnail", widget: "image", required: false}
              - {label: "Media Format", name: "media_format", widget: "select", options: ["Horizontal", "Vertical"], default: "Horizontal"}
              - {label: "Top Meta Tag", name: "meta", widget: "string"}
              - {label: "Caption / Title", name: "caption", widget: "string"}
              - {label: "External Source URL", name: "url", widget: "string", required: false}
          - label: "Hall of Records (Awards)"
            name: "awards"
            widget: "list"
            collapsed: true
            summary: '{{fields.meta}} - {{fields.caption}}'
            fields:
              - {label: "Media Type", name: "type", widget: "select", options: ["image", "video"], default: "image"}
              - {label: "Media File", name: "src", widget: "file"}
              - {label: "Video Thumbnail", name: "thumbnail", widget: "image", required: false}
              - {label: "Media Format", name: "media_format", widget: "select", options: ["Horizontal", "Vertical"], default: "Horizontal"}
              - {label: "Top Meta Tag", name: "meta", widget: "string"}
              - {label: "Caption / Title", name: "caption", widget: "string"}
              - {label: "External Source URL", name: "url", widget: "string", required: false}

  - name: "page_achievements_timeline"
    label: "⏳ Page: Timeline"
    files:
      - label: "Timeline Editor"
        name: "achievements_timeline"
        file: "content/pages/achievements_timeline.md"
        fields:
          - label: "Historical Milestones"
            name: "timeline"
            widget: "list"
            collapsed: true
            fields:
              - {label: "Date / Event Meta", name: "date_meta", widget: "string"}
              - {label: "Milestone Title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}

  - name: "page_sponsors"
    label: "🤝 Page: Sponsors"
    files:
      - label: "Sponsors Roster Editor"
        name: "sponsors"
        file: "content/pages/sponsors.md"
        fields:
          - {name: "permalink", widget: "hidden", default: false}
          - label: "Sponsorship Tiers"
            name: "tiers"
            widget: "list"
            collapsed: true
            fields:
              - {label: "Tier Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Tier Title", name: "title", widget: "string"}
              - label: "Sponsors in this Tier"
                name: "sponsors_list"
                widget: "list"
                collapsed: true
                fields:
                  - {label: "Sponsor Name", name: "name", widget: "string"}
                  - {label: "Sponsor Logo", name: "logo", widget: "image", required: false}
                  - {label: "Website URL", name: "url", widget: "string", required: false}

  - name: "page_sponsor_us"
    label: "💼 Page: Sponsor Us (PDF)"
    files:
      - label: "Sponsor Action Editor"
        name: "sponsor_us"
        file: "content/pages/sponsor_us.md"
        fields:
          - {name: "permalink", widget: "hidden", default: false}
          - {label: "Prospectus Document", name: "prospectus_pdf", widget: "file"}
          - {label: "Faculty Board Email Address", name: "contact_email", widget: "string"}
          - {label: "Default Email Subject Line", name: "email_subject", widget: "string", default: "Corporate Partnership Inquiry - Aerial Martial"}

  - name: "page_contact"
    label: "📞 Page: Contact"
    files:
      - label: "Contact Details Editor"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - {label: "Primary Email", name: "email", widget: "string"}
          - {label: "Facility Location", name: "location", widget: "text"}
          - {label: "Direct Line", name: "phone", widget: "string"}
          - label: "Social Networks"
            name: "socials"
            widget: "list"
            collapsed: true
            summary: '{{fields.platform}}'
            fields:
              - {label: "Platform Name", name: "platform", widget: "string"}
              - {label: "Profile URL", name: "url", widget: "string"}
              
